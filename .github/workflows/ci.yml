name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep CI builds lean: debug info is not needed.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  lint:
    name: fmt / clippy / docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # CPU tests. GPU tests are #[ignore]d here and only compiled.
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - name: Build examples
        run: cargo build -p kiln --examples

  gpu:
    name: GPU tests (lavapipe)
    runs-on: ubuntu-24.04
    env:
      # Mesa's software Vulkan driver; validation must be present and clean.
      KILN_GPU: llvmpipe
      KILN_VALIDATION: required
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa lavapipe and Vulkan validation layers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers vulkan-tools xvfb
          vulkaninfo --summary
      - run: cargo xtask doctor
      - run: cargo xtask gpu-test
      - name: Smoke-run examples (windowed, under Xvfb)
        run: |
          cargo build -p kiln --examples
          for ex in hello_window triangle spinning_cube gltf_viewer; do
            echo "::group::$ex"
            KILN_SMOKE_FRAMES=60 KILN_LOG=info xvfb-run -a "target/debug/examples/$ex"
            echo "::endgroup::"
          done
      - name: Upload golden image diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: target/golden-diff/
          if-no-files-found: ignore

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
